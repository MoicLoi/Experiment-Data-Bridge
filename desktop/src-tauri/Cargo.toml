[package]
name = "edb-desktop"
version = "0.25.0"
description = "Experiment Data Bridge desktop shell"
edition = "2021"

[lib]
name = "edb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
