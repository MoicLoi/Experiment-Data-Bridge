name: edb-python-worker-dev

services:
  python-worker:
    image: edb/python-worker:dev
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${EDB_WORKER_PUBLISHED_PORT:-8000}:8000"
    environment:
      EDB_WORKER_HOST: 0.0.0.0
      EDB_WORKER_PORT: "8000"
      EDB_WORKER_BEARER_TOKEN: "${EDB_WORKER_BEARER_TOKEN:-}"
      EDB_WORKER_MAX_UPLOAD_BYTES: "${EDB_WORKER_MAX_UPLOAD_BYTES:-10737418240}"
      EDB_WORKER_IMAGE_VERSION: "${EDB_WORKER_IMAGE_VERSION:-dev}"
    read_only: true
    tmpfs:
      - /var/tmp/edb-worker:rw,noexec,nosuid,size=2147483648,uid=10001,gid=10001,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${EDB_WORKER_CPUS:-2.0}"
    mem_limit: "${EDB_WORKER_MEMORY:-4g}"
    stop_grace_period: 20s
